# 本地开发：用 nginx 托管前端构建产物，并代理后端 API。
# 启动（前台保持，避免 Windows 子进程被回收）：
#   D:\nginx-1.30.6\nginx.exe -p D:\nginx-1.30.6\ -c D:\Project\rkplatform\deploy\nginx\local.conf -g "daemon off;"
# 停止（另一个终端）：
#   D:\nginx-1.30.6\nginx.exe -p D:\nginx-1.30.6\ -c D:\Project\rkplatform\deploy\nginx\local.conf -s stop

worker_processes  1;
error_log  D:/nginx-1.30.6/logs/rk-error.log;
pid        D:/nginx-1.30.6/logs/rk-nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       D:/nginx-1.30.6/conf/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size  20m;

    gzip  on;
    gzip_types  text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen       80;
        server_name  localhost;

        root  D:/Project/rkplatform/web/dist;
        index index.html;

        # SPA 路由回退：刷新 /login、/profile 等仍返回 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 后端业务接口（与 Vite dev 的 /api 代理等价）
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
        }

        # 后端静态托管的题干图片
        location /uploads/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
